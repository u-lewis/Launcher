[package]
name = "launcher"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
eframe = "0.29"
chrono = "0.4"
serde_json = "1"
ureq = "2"
zip = "2"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
gilrs = "0.11"
sysinfo = "0.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
